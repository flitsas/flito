name: CI

on:
  push:
    # develop/staging/release también disparan CD; el CI corre en paralelo como
    # gate de calidad (build + tests) para todas las ramas de ambiente.
    branches: [main, develop, staging, release]
  pull_request:
    branches: [main, develop, staging, release]

# Cancela runs viejos del mismo branch/PR cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 2026-10-26 — el antiguo job monolítico `build-test` (~12 min y creciendo) se partió en
  # cuatro caminos paralelos: `checks` (guardas de solo-fuentes), `test-api` (suite API en
  # 4 shards matrix), `build-api` (typecheck) y `build-web` (typecheck + vite + guards de
  # dist). El camino crítico pasa a ser npm ci + el shard más lento (~4-5 min). El job
  # `build-test-gate` conserva el nombre de check «build + test» que exige la protección
  # de rama y vigila `pr-monitor-agent`: falla si cualquiera de los cuatro falla.
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # @playwright/test está en devDeps de apps/web; ESTE job no corre e2e, así que evitamos
      # descargar navegadores en el npm ci. El único que sí los necesita es `e2e-visor-pdf`
      # (HU #11774), que instala chromium en su propio job.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      # Sin `npm run build -w @operaciones/shared-types`: el alias de
      # `apps/api/vitest.config.ts` resuelve el paquete a su FUENTE, y los checks
      # siguientes solo leen fuentes (AST/regex). Este job no compila nada.
      - name: Test shared-types (vitest)
        run: npm run test:shared-types

      # OPS-13 — gate de Rules of Hooks: falla si un hook se llama tras un early
      # return o dentro de un condicional (clase de bug de #147 = pantalla blanca).
      # Sólo lee fuentes (sin build) → falla rápido. Complementa el
      # eslint-plugin-react-hooks del job `lint` (OPS-12).
      - name: Rules of Hooks scan (web)
        run: npm run check:hooks

      # HU #12872 (AC8) — la web no decide acceso por el nombre del rol (Épica #13411). AST, sin
      # build; su propio test con node:test (fixtures positivos/negativos y la excepción declarada).
      - name: Sin nombre de rol en la web (check + test)
        run: |
          node --test scripts/check-roles-web.test.mjs
          npm run check:roles-web

      # Contraste, DOS invariantes distintas en el mismo script:
      #   · Bug #11720 (oscuro) · Bug #11767 (claro) — la CommandPalette en LOS DOS temas. El
      #     claro es el de por defecto y estuvo sin cubrir hasta el #11767: se medía sólo el
      #     minoritario.
      #   · Bug #11766 — que todo punto de todo `--flit-gradient-*` admita texto blanco, y que el
      #     anillo `.flit-focus-light` cumpla sobre el gradiente del drawer. Son los cuatro
      #     gradientes del kit: el mayor sustrato de texto del producto.
      #
      # Va aquí, junto al resto de guardas que solo leen fuentes, porque el CI no ejecuta la suite
      # E2E —desde la HU #11774 solo corre el spec del visor de PDF, en el job `e2e-visor-pdf`— y
      # `axe` no es dependencia del repo: sin este paso, que el ítem activo vuelva a ser invisible
      # en oscuro —o que un gradiente vuelva a llevar blanco a 1,81— no lo detectaría nadie hasta
      # que lo reporte una persona. Con los gradientes hay además un motivo de más: `axe` no mide
      # un fondo `background-image`, lo marca `incomplete`, así que ni ejecutando E2E saltaría.
      - name: Contraste (CommandPalette claro+oscuro · gradientes FLIT · anillo de foco)
        run: npm run check:contraste

      # HU #11775 — origen del worker de pdf.js. pdf.js valida el handshake API↔worker en runtime y
      # lanza si las versiones no casan; hasta esa HU el `workerSrc` era la cadena `'/pdf.worker.min.js'`
      # apuntando a una copia manual en `public/`, de modo que subir `pdfjs-dist` sin recopiar el
      # fichero compilaba, pasaba lint y pasaba este CI entero mientras dejaba los cuatro visores en
      # «No se pudo abrir el documento» en el navegador. Este gate exige que la URL salga siempre de
      # `src/lib/pdfWorker.ts` (import con `?url` → asset con hash desde node_modules) y que no
      # reaparezca ninguna ruta escrita a mano ni ninguna copia en `public/`.
      - name: Origen del worker de pdfjs (web)
        run: npm run check:pdf-worker

      # 2026-10-26 — gate estático de patrón visual FLITO (decisión «ux-enforcement»):
      # `<table>` cruda en módulos FLITO (la tabla es la FlitTable del kit), HEX sueltos
      # (regla 13 de AGENTS.md: tokens --flit-*, no HEX) y controles crudos con altura fija
      # `h-N` (la altura la fija el kit). AST no hace falta: línea a línea sin comentarios.
      - name: Patrón visual FLITO (check + test)
        run: |
          node --test scripts/check-ui.test.mjs
          node scripts/check-ui.mjs

  # Suite API en shards matrix. `fileParallelism: false` (serial) es deliberado por mocks de
  # módulo compartidos DENTRO del mismo proceso; cada shard es un proceso y un job aparte con
  # su subconjunto de archivos en serial, así que el aislamiento se mantiene y el tiempo se
  # divide ~4. Validado en local el 2026-10-26: los 4 shards verdes (675 archivos de test).
  # `fail-fast: false`: si un shard se rompe, los demás terminan y el diagnóstico es completo.
  test-api:
    name: test api (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      # Los tests mockean Postgres/Redis (drizzle chain + env de __tests__/setup.ts), por eso
      # NO se necesitan servicios externos. El alias de `apps/api/vitest.config.ts` resuelve
      # shared-types a fuente DENTRO de vitest, pero los tests de seed (migracion-0179/0205)
      # lanzan `npx tsx` como subproceso, que resuelve `@operaciones/shared-types` por su
      # `main` → `dist/`: sin este build esos archivos fallan con «action no cuelga de
      # ninguna página» o MODULE_NOT_FOUND. ~20 s que no se pueden ahorrar.
      - name: Build shared-types (tsc)
        run: npm run build -w @operaciones/shared-types

      # HU #13207: los tests de compresión de comprobantes usan pdftotext/pdftoppm reales (poppler).
      - name: Instalar poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Test API (vitest, shard ${{ matrix.shard }}/4)
        run: npm run test -w apps/api -- --shard=${{ matrix.shard }}/4

  build-api:
    name: build api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Build shared-types (tsc)
        run: npm run build -w @operaciones/shared-types

      # Typecheck: el build de API es `tsc -b && tsc-alias`. El heap lo pone el entorno del
      # runner (ver «Heap de build:api» en AGENTS.md): sin flag y con el árbol frío compila.
      - name: Build API (tsc)
        run: npm run build:api

  build-web:
    name: build web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Build web (typecheck + vite)
        run: npm run build:web

      # HU #12222 — gate del favicon. Va DESPUÉS del build a propósito: compara `apps/web/public/`
      # contra el `apps/web/dist/` recién generado. El defecto que atrapa no produce 404 —nginx
      # responde el index.html del SPA con estado 200 para cualquier ruta que no exista— así que
      # ningún build, lint, typecheck ni E2E lo veía: es la misma clase de fallo silencioso que la
      # copia manual del worker de pdfjs.
      - name: Favicon declarado ≡ servido (web)
        run: npm run check:favicon

      # FIONA F3 — gate de presupuesto de bundle: falla si el chunk `index`
      # (entry de /login) supera su budget gzip. Atrapa regresiones de tamaño
      # (imports estáticos pesados, pérdida de code-splitting).
      - name: Bundle budget (web)
        run: npm run check:bundle

  # Agregador: conserva el check «build + test» que la protección de rama y
  # `pr-monitor-agent` vigilan. `if: always()` es la pieza clave: sin él, un fallo en un
  # need marcaría este job como «skipped» y la protección de rama podría contarlo como
  # verde; con él, el job corre siempre y sale rojo nombrando al culpable.
  build-test-gate:
    name: build + test
    needs: [checks, test-api, build-api, build-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Veredicto agregado de checks / test-api / builds
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          ROTO=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' | paste -sd' ' -)
          if [ -n "$ROTO" ]; then
            echo "::error::build + test en rojo por: $ROTO"
            exit 1
          fi
          echo "build + test — OK: checks, test-api (4 shards), build api y build web en verde."

  # Gate de lint — ESLint flat config (eslint.config.mjs). Son ERROR (= check
  # rojo) max-lines (800 global; techos congelados por archivo legacy) y
  # react-hooks/rules-of-hooks. La deuda preexistente reporta como warnings
  # sin bloquear; endurecimiento gradual documentado en AGENTS.md.
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: ESLint
        run: npm run lint

  # Gate de seguridad SCA — precondición de merge #6 de flit-integration-ado.
  # Falla con cualquier vulnerabilidad High o Critical en dependencias de
  # producción (tolerancia 0 según security-agent; una excepción aprobada se
  # documenta en el PR y se registra, acotada a un advisory, en
  # scripts/dependency-audit.mjs).
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: npm audit (dependencias de producción)
        run: node scripts/dependency-audit.mjs

      # HU #11289 — función de forzado sobre las exenciones del gate anterior: falla si alguna
      # entrada de EXEMPTIONS ya no aparece en el audit. Sin esto, una exención sobrevive a la
      # actualización que la vuelve innecesaria y enmascara advisories futuros del mismo URL.
      # Que hoy pdfjs-dist siga en 3.x es justo lo que la mantiene legítima; cuando suba a v6 este
      # paso se pondrá rojo hasta que se borre la entrada.
      - name: Exenciones vigentes (sin zombis)
        run: npm run check:exemptions

  # Gate de trazabilidad — convenciones de rama y título del PR
  # (.cursor/rules/convenciones-rama-pr.mdc). Todo desarrollo va ligado a una HU
  # o un Bug de Azure DevOps: sin eso no hay trazabilidad del proyecto.
  # El título llega por env y no interpolado en `run:` — un título de PR es
  # entrada de usuario y en el shell sería inyección de comandos.
  naming:
    name: naming
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Convenciones de rama y título del PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=100
          # La lista de cambios solo alimenta la guarda «CHORE/DOCS no toca producto».
          # Si no se puede calcular, se sigue validando rama y título.
          if ! git diff --name-only "origin/$BASE_REF...HEAD" >/tmp/naming-changed.txt; then
            echo "::warning::No se pudo calcular el diff contra $BASE_REF; se omite la guarda de rutas de producto."
            : >/tmp/naming-changed.txt
          fi
          node scripts/check-naming.mjs \
            --branch "$HEAD_REF" \
            --title "$PR_TITLE" \
            --files-from /tmp/naming-changed.txt

  # Gate de veredictos pre-PR — enforcement parcial de la disciplina de
  # .cursor/rules/pre-pr-gates.mdc. Los gates (flit-code-review, qa-agent B,
  # security-agent, db-review-agent) los ejecuta el hilo antes de abrir el PR y
  # ningún check puede saber si corrieron de verdad; lo que sí puede exigir CI es
  # que el cuerpo del PR los declare en verde o N/A con motivo. Aplica solo a PRs
  # de producto (HU/BUG); CHORE/DOCS/RELEASE pasan como N/A. El título y el cuerpo
  # llegan por env y no interpolados en `run:` — son entrada de usuario y en el
  # shell serían inyección de comandos.
  pr-gates:
    name: pr-gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Veredictos pre-PR declarados en el cuerpo del PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-gates.mjs

  # Gate de secretos — precondición de merge #6 de flit-integration-ado.
  # Escanea los commits del PR (o los últimos 100 en push) con gitleaks.
  # Se usa el binario directo y no la action oficial: la action exige licencia
  # para organizaciones; el binario es MIT. Un hallazgo real = check rojo =
  # merge bloqueado + rotación del secreto.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan de secretos (gitleaks)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=100
            /tmp/gitleaks git --redact --log-opts="origin/${{ github.base_ref }}..HEAD" .
          else
            /tmp/gitleaks git --redact --log-opts="-100" .
          fi

  # HU #11774 — el ÚNICO E2E que corre en el CI de cada PR, y el único del repositorio que abre un
  # PDF de verdad: sirve un fixture de dos páginas como cuerpo de la respuesta y comprueba que el
  # visor lo rasteriza (dos `<img>` con `naturalWidth > 0`).
  #
  # Por qué merece un job propio y no espera al smoke nocturno: el nocturno no bloquea nada —avisa
  # al día siguiente, con el cambio ya en `develop`— y lo que este spec vigila es justo lo que mueve
  # la cadena #11774 → #11775 → #11289. La #11775 YA la movió: el worker dejó de ser una copia fija
  # en `public/` y hoy lo emite el bundler como artefacto con hash desde `node_modules`
  # (`src/lib/pdfWorker.ts`, guardado por `check:pdf-worker`); de la cadena queda pendiente el salto
  # de versión de la #11289. Desde la #11775 un especificador que no resuelve sí rompe el build
  # (Rollup, exit 1), pero lo que el build sigue SIN ver es que el worker emitido no funcione al
  # cargarse —MIME, caché o desajuste de versión API↔worker—: la pantalla monta igual y solo enseña
  # «Setting up fake worker failed». Sin este job, el primero en enterarse sería un usuario.
  #
  # Es el único que descarga navegador, por eso va aparte de los jobs de fuentes (que conservan su
  # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD): son ~2 minutos de `playwright install` que no tiene sentido
  # pagar en los jobs que solo leen fuentes.
  #
  # No se necesita `npm run build -w @operaciones/shared-types`: el dev server de Vite resuelve el
  # paquete por su campo `module` (src/index.ts), no por `dist`. Tampoco hace falta API: el spec
  # mockea TODO con `page.route`, incluida la respuesta que sirve el PDF (en CI no hay nada
  # escuchando en el 3005 al que apunta el proxy de Vite).
  e2e-visor-pdf:
    name: e2e · visor PDF real
    # Fijado a 24.04: ubuntu-latest pasó a 26.04 y Playwright 1.59.1 no publica Chromium para esa
    # versión («Playwright does not support chromium on ubuntu26.04-x64»). Volver a ubuntu-latest
    # cuando se suba Playwright a una versión que lo soporte.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspaces)
        run: npm ci
        working-directory: .

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # CI='1' → `reuseExistingServer: false`, así que Playwright levanta su propio `npm run dev`
      # en el 5175 y no hereda ningún server ajeno.
      - name: E2E del visor de PDF
        run: npm run test:e2e:visor-pdf
        env:
          CI: '1'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visor-pdf
          path: apps/web/playwright-report/
          retention-days: 7
