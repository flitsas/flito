name: E2E smoke (nightly)

on:
  schedule:
    # 05:00 UTC ≈ 00:00 COT — señal diaria sin bloquear merges
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-smoke-nightly
  cancel-in-progress: true

jobs:
  e2e-smoke:
    # El número va a mano: nada lo valida. Al añadir o quitar un spec de `test:e2e:smoke`
    # (apps/web/package.json) hay que moverlo aquí, o el nombre del run miente.
    # 14 → 15 en la HU #11774 (visor-pdf-real.spec.ts).
    # 15 → 16 en la HU #11914 (soat-cliente-solicitud.spec.ts): el canal Cliente es el primer camino
    # de ESCRITURA de un rol externo, y el CI de PR solo corre el spec del visor.
    # 16 → 17 en la HU #11915, y SUSTITUIDO en la #12079: la revisión de Operaciones se retiró, y su
    # sitio lo ocupa soat-envio-directo-gestor.spec.ts, que cubre lo que ahora decide a qué gestor
    # sale una solicitud del canal y qué ve de ella la empresa externa.
    name: playwright smoke (20 specs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (workspaces)
        run: npm ci
        working-directory: .

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run test:e2e:smoke
        env:
          CI: '1'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
