name: CD - Build & Deploy to VPS

on:
  push:
    branches: [release, staging, develop]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Nombres de imagen UNIFICADOS con prefijo ghcr.io/, igual que el pull del
  # docker-compose.prod.yml en el VPS. El ambiente se diferencia por TAG
  # (dev/qa/pdn), no por nombre de repo.
  API_IMAGE: ghcr.io/flitsas/flito/api
  WEB_IMAGE: ghcr.io/flitsas/flito/web

jobs:
  # ── Resolver ambiente según la rama ─────────────────────────────────────────
  # develop -> dev, staging -> qa, release -> pdn.
  # Centraliza el mapeo rama -> {ambiente, dominio, tag, puertos} en un solo lugar.
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      gh_env: ${{ steps.env.outputs.gh_env }}
      front_domain: ${{ steps.env.outputs.front_domain }}
      api_domain: ${{ steps.env.outputs.api_domain }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      deploy_tag: ${{ steps.env.outputs.deploy_tag }}
      front_port: ${{ steps.env.outputs.front_port }}
      api_port: ${{ steps.env.outputs.api_port }}
    steps:
      - name: Map branch to environment
        id: env
        run: |
          # Puertos por ambiente — front: DEV 4051 / QA 5051 / PDN 6051;
          #                        api:   DEV 4052 / QA 5052 / PDN 6052.
          # gh_env: nombre del GitHub Environment donde viven los secrets del VPS
          # (Environments configurados: develop/staging/production). env_name
          # (dev/qa/pdn) se usa para tags de imagen y COMPOSE_PROJECT_NAME.
          # api_domain: dominio público directo de la API (el reverse-proxy del
          # host lo enruta a 127.0.0.1:<api_port>); el tráfico del SPA va por el
          # proxy /api del contenedor web, así que CORS usa solo front_domain.
          case "${{ github.ref_name }}" in
            release)
              env_name=pdn
              gh_env=production
              front_domain=operaciones.flitsas.com
              api_domain=api.operaciones.flitsas.com
              image_tag=pdn
              front_port=6051; api_port=6052
              ;;
            staging)
              env_name=qa
              gh_env=staging
              front_domain=qa.operaciones.flitsas.online
              api_domain=api.qa.operaciones.flitsas.online
              image_tag=qa
              front_port=5051; api_port=5052
              ;;
            develop)
              env_name=dev
              gh_env=develop
              front_domain=dev.operaciones.flitsas.online
              api_domain=api.dev.operaciones.flitsas.online
              image_tag=dev
              front_port=4051; api_port=4052
              ;;
            *)
              echo "::error::Rama no soportada para deploy: ${{ github.ref_name }}"
              exit 1
              ;;
          esac
          # Tag con el que se DESPLIEGA (lo que el VPS hace pull):
          #   PDN -> sha-<commit> inmutable (rollback determinista en producción).
          #   DEV/QA -> tag móvil del ambiente (siempre lo último de la rama).
          if [ "$env_name" = "pdn" ]; then
            deploy_tag="sha-${GITHUB_SHA}"
          else
            deploy_tag="$image_tag"
          fi
          {
            echo "env_name=$env_name"
            echo "gh_env=$gh_env"
            echo "front_domain=$front_domain"
            echo "api_domain=$api_domain"
            echo "image_tag=$image_tag"
            echo "deploy_tag=$deploy_tag"
            echo "front_port=$front_port"
            echo "api_port=$api_port"
          } >> "$GITHUB_OUTPUT"
          echo "Ambiente: $env_name | front: $front_domain ($front_port) | api: $api_domain ($api_port) | build-tag: $image_tag | deploy-tag: $deploy_tag"

  build-api:
    name: Build & push api image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El driver docker-container de Buildx baja moby/buildkit de Docker Hub al
      # arrancar y a veces da timeout (context deadline exceeded). La pre-descargamos
      # con reintentos; si queda local, Buildx no la vuelve a bajar.
      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — api
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push api
        id: build
        uses: docker/build-push-action@v6
        with:
          # Contexto = raíz del repo (npm workspaces necesita el lockfile raíz).
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build & push web image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — web
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      # El frontend usa rutas RELATIVAS /api (proxy nginx del contenedor web),
      # por eso la MISMA imagen sirve para los 3 ambientes: sin build-args de URL.
      - name: Build and push web
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Desde el 2026-10-23 los TRES ambientes se despliegan por GitOps (no hay mas deploy por SSH):
  # DEV/QA en el k3s de la 177 (desde el 2026-10-18) y PDN en el k3s de la 145. Si volviera un
  # deploy por SSH a docker compose, levantaria el stack viejo con los crons de SIIGO, RNDC y la
  # sync duplicados contra la misma base.

  # ── DEV / QA / PDN por GitOps ─────────────────────────────────────────────
  # Escribe los digests recien construidos en flit-gitops/services/flito-<env>/kustomization.yaml;
  # el Argo CD del clúster de cada ambiente los aplica (dev/qa: 177; pdn: 145, Application en
  # clusters/vps-145). Las migraciones corren en el initContainer db-apply de la api.
  # Rollback = revertir ese commit.
  # OJO: la CONFIGURACION ya no sale del .env del servidor ni de docker-compose.prod.yml; vive en
  # flit-gitops/services/flito-<env>/ (configmaps.yaml + sealed-secrets.yaml).
  deploy-gitops:
    name: Deploy ${{ needs.setup.outputs.env_name }} (GitOps)
    if: github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'release'
    needs: [setup, build-api, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.setup.outputs.gh_env }}
      url: https://${{ needs.setup.outputs.front_domain }}
    env:
      API_DIGEST: ${{ needs.build-api.outputs.digest }}
      WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
      NS: flito-${{ needs.setup.outputs.env_name }}
    steps:
      - name: Actualizar digests en flit-gitops
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GITOPS_TOKEN" ] || { echo "::error::Falta el secret GITOPS_TOKEN (secret de la organizacion; dar acceso a este repo)"; exit 1; }
          for v in API_DIGEST WEB_DIGEST; do
            [[ "${!v}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$v invalido: '${!v}'"; exit 1; }
          done
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/${{ github.repository_owner }}/flit-gitops.git" gitops
          cd gitops
          K="services/${NS}/kustomization.yaml"
          set_digest() {
            yq -e "(.images[] | select(.name == \"$1\"))" "$K" > /dev/null
            yq -i "(.images[] | select(.name == \"$1\")).digest = \"$2\"" "$K"
          }
          set_digest "${{ env.API_IMAGE }}" "$API_DIGEST"
          set_digest "${{ env.WEB_IMAGE }}" "$WEB_DIGEST"
          git config user.name "flit-ci"
          git config user.email "ci@flitsas.com"
          git add "$K"
          if git diff --cached --quiet; then echo "Los digests ya eran estos: nada que desplegar."; exit 0; fi
          git commit -m "${NS}: despliegue ${GITHUB_SHA::7} (${{ github.repository }} ${{ github.ref_name }})" \
                     -m "api ${API_DIGEST}" -m "web ${WEB_DIGEST}"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rechazado (intento $i); rebase y reintento..."
            git pull --rebase
          done
          echo "::error::No se pudo empujar a flit-gitops tras 3 intentos"; exit 1

      # Argo CD sondea el repo cada ~3 min. Comprueba que el ambiente SIGUE SANO tras el despliegue.
      - name: Comprobar que responde
        run: |
          sleep 180
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 -o /dev/null "https://${{ needs.setup.outputs.front_domain }}/" \
               && curl -fsS --max-time 10 "https://${{ needs.setup.outputs.api_domain }}/api/health" > /dev/null; then
              echo "Responde (intento $i)."; exit 0
            fi
            echo "Intento $i: aun no responde; reintento en 15 s"; sleep 15
          done
          echo "::error::No responde 10 min despues del despliegue. Revisar Argo CD ($NS) (dev/qa: 177, pdn: 145); rollback = revertir el commit de flit-gitops."
          exit 1
