name: Instalar dependencias (con caché de node_modules)
description: >
  Node 22 + node_modules de los workspaces restaurado desde caché. Solo corre `npm ci` si la
  caché no existe para este package-lock.json. Sustituye el par setup-node(cache: npm) + npm ci,
  que costaba 30-50 s por job aunque la caché de ~/.npm acertara: npm ci borra node_modules y
  vuelve a extraer y enlazar todo. Con la caché de node_modules el job arranca en ~5-10 s.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    # La clave lleva la versión exacta de Node: los binarios nativos de node_modules (esbuild,
    # rollup, etc.) dependen de ella. `-v1` permite invalidar la caché a mano subiendo el sufijo.
    - name: Versión de Node (clave de caché)
      id: node
      shell: bash
      run: echo "version=$(node -v)" >> "$GITHUB_OUTPUT"

    - name: Caché de node_modules
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-v1-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}

    - name: Install (workspaces)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
