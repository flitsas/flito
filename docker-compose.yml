# docker-compose LOCAL — desarrollo/pruebas en la máquina del desarrollador.
#
# A diferencia del VPS (docker-compose.prod.yml), aquí SÍ se levantan Postgres
# y Redis en contenedores para que el stack sea autocontenido.
#
# Puertos (defaults = convención DEV):
#   web       http://localhost:4051   (nginx: estático + proxy /api → api)
#   api       http://localhost:4052   (Express; health: /api/health)
#   postgres  localhost:5434          (5432/5433 suelen estar ocupados en local)
#   redis     localhost:6380          (6379 suele tener un Redis local)
#   minio     localhost:9002          (consola web en 9002 → :9003)
#
# Uso:
#   docker compose up -d --build          # levanta todo (migraciones y seed incluidos)
#
# Usuarios que deja el seed: admin / Admin2026!  ·  operaciones / flito2026
# (y gestor.sura, gestor.estado, auditoria, mensajero, financiera… todos con flito2026)
#   docker compose logs -f api            # logs del backend
#   docker compose down -v                # apaga y borra datos (¡borra la BD!)
#
# Los valores por defecto de secretos son SOLO PARA DESARROLLO LOCAL.
# Cualquier variable se puede sobrescribir con un archivo .env junto a este compose.

name: flito

x-restart-policy: &restart unless-stopped

# Entorno compartido por `api` y `seed`. Está extraído a un ancla porque el seed importa
# db/client.ts → config/env.ts, que valida TODAS las variables con Zod y aborta el boot si
# falta una: necesita el mismo bloque completo que la api, no solo DATABASE_URL. (`migrate`
# no lo necesita: db-apply.ts lee process.env directo, sin pasar por env.ts.)
x-api-env: &api-env
  NODE_ENV: development
  PORT: ${API_PORT:-4052}
  DATABASE_URL: postgresql://operaciones_app:${POSTGRES_PASSWORD:-flito_local_dev}@postgres:5432/operaciones_db
  REDIS_URL: redis://redis:6379
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4051}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4051}
  # ─ Secretos SOLO-DEV (cumplen validación Zod de env.ts; NUNCA usar en VPS) ─
  JWT_SECRET: ${JWT_SECRET:-flito-local-dev-jwt-secret-no-usar-en-produccion-0000}
  RUNT_INTERNAL_KEY: ${RUNT_INTERNAL_KEY:-flito-local-dev-runt-key-0000}
  PII_ENC_KEY: ${PII_ENC_KEY:-0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0}
  PII_HMAC_KEY: ${PII_HMAC_KEY:-a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90}
  # ─ Facturación electrónica Siigo ─
  # El access_key NO va aquí: vive cifrado en `siigo_credenciales` bajo SIIGO_ENC_KEY y se
  # registra por API. Del entorno salen solo la llave maestra que lo descifra y el Partner-Id.
  #
  # SIIGO_ENC_KEY va SIN valor por omisión, a diferencia de JWT_SECRET y las PII_*. No es
  # descuido: credenciales.service.ts decidió que sin llave maestra no se opera, y una llave
  # de relleno cifraría el access_key con un valor distinto en cada máquina — el día que se
  # configurara la real dejarían de descifrar sin explicación. Sin valor, Compose no inyecta
  # la variable y la API arranca igual; solo falla la operación de Siigo, con el código
  # `llave_maestra`, que es exactamente lo que hay que ver. Compose la toma del .env si está.
  SIIGO_ENC_KEY:
  SIIGO_PARTNER_ID: ${SIIGO_PARTNER_ID:-}
  # Estas cuatro SÍ llevan valor por omisión: env.ts las valida con enum y url, y un enum vacío
  # aborta el boot en vez de caer al default (`.default()` solo cubre undefined, no '').
  SIIGO_MODE: ${SIIGO_MODE:-mock}
  SIIGO_AMBIENTE: ${SIIGO_AMBIENTE:-pruebas}
  SIIGO_BASE_URL: ${SIIGO_BASE_URL:-https://api.siigo.com}
  # Interruptor único de los tres crons de Siigo (Bug #11649). Apagado por omisión, igual que en
  # `env.ts`: emitir ante la DIAN es irreversible. Sin esta línea la variable no llegaría al
  # contenedor y en desarrollo no habría forma de encenderlos, porque este bloque enumera el
  # entorno explícitamente y no usa `env_file`.
  SIIGO_CRONS: ${SIIGO_CRONS:-off}
  # ─ Integraciones opcionales (mock/vacío por defecto en dev) ─
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  RNDC_MODE: ${RNDC_MODE:-mock}
  FIRMA_PROVIDER: ${FIRMA_PROVIDER:-mock}
  FLIT_ADAPTER: ${FLIT_ADAPTER:-mock}
  # Storage → MinIO de este compose. Las tres primeras son IMPRESCINDIBLES: sin
  # ellas env.ts cae a s3.kyverum.com:443 por HTTPS, es decir, el S3 de producción.
  S3_ENDPOINT: minio
  S3_PORT: '9000'
  S3_USE_SSL: 'false'
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-flito-dev-access}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-flito-dev-secret}
  SMTP_PASS: ${SMTP_PASS:-}
  # ─ Google Drive (barrido de derechos de trámite) ─
  # Ruta DENTRO del contenedor, fija a propósito: googleDrive.ts hace path.resolve(),
  # que resuelve contra el CWD (/app/apps/api), así que una ruta relativa del host se
  # convertiría en /app/apps/api/<lo-que-pusiste> y no existiría. El archivo entra por
  # bind mount (ver `volumes` de api); NO se copia a la imagen, que es lo correcto para
  # una credencial. Para apuntar a otro archivo del host usa GOOGLE_DRIVE_KEY_FILE.
  GOOGLE_DRIVE_KEY_PATH: /run/secrets/google-service-account.json
  GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-1cWFfPFpesQbHS6lLikumbDKYHO88G8DC}
  # Barrido diario: apagado salvo '1' explícito (gasta OCR de pago). Igual que en env.ts.
  DRIVE_DERECHOS_CRON_ENABLED: ${DRIVE_DERECHOS_CRON_ENABLED:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operaciones_db
      POSTGRES_USER: operaciones_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flito_local_dev}
    ports:
      # 5434 en el host: 5432 suele tener un Postgres local y 5433 lo usa
      # flit-file-manager. Este mapeo es solo para clientes SQL desde el host.
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U operaciones_app -d operaciones_db']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: *restart

  redis:
    image: redis:7-alpine
    ports:
      # 6380 en el host para NO chocar con un Redis local en 6379 (la API usa la
      # red interna de compose; este mapeo es solo para redis-cli desde el host).
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: *restart

  # Almacenamiento de evidencias/documentos. SIN esto, S3_ENDPOINT caía al default de
  # env.ts (s3.kyverum.com:443) y el entorno local salía a internet contra el S3 de
  # PRODUCCIÓN con credenciales de mentira: toda subida moría con
  # «The Access Key Id you provided does not exist in our records».
  # El bucket (operaciones-biometrics) lo crea la propia app —storage.ts hace
  # bucketExists + makeBucket—, así que no hace falta un init que lo provisione.
  minio:
    image: minio/minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      # Deben coincidir con S3_ACCESS_KEY/S3_SECRET_KEY de la api: son el mismo par.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-flito-dev-access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-flito-dev-secret}
    ports:
      # 9002/9003 en el host: el contenedor suelto `flito-minio` de desarrollo ocupa
      # 9000/9001. Dentro de la red de compose la api sigue hablándole por 9000.
      - '127.0.0.1:${MINIO_PORT:-9002}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: *restart

  # Job one-shot: aplica migraciones SQL pendientes (idempotente) antes de que
  # arranque la API. Reusa la MISMA imagen de la api.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: flito/api:local
    command: ['node', 'dist/scripts/db-apply.js']
    environment:
      DATABASE_URL: postgresql://operaciones_app:${POSTGRES_PASSWORD:-flito_local_dev}@postgres:5432/operaciones_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Job one-shot: siembra usuarios y parametrización, después de migrar. Compose aplicaba
  # las migraciones solo pero NO los datos iniciales, así que cada `down -v` dejaba el
  # esquema completo y CERO usuarios: la app quedaba inaccesible hasta sembrar a mano.
  #
  # Idempotente, por eso puede correr en cada `up`:
  #   db/seed.js         → onConflictDoNothing en el admin; ON CONFLICT DO NOTHING en LAFT
  #   flito-seed.js      → sale temprano si ya hay parametrización, sin re-sembrar
  #
  # Contraseñas: admin → Admin2026! · el resto → flito2026 (CONTRASENA_DEMO).
  # Es un compose de desarrollo local; NO portar este servicio al VPS.
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: flito/api:local
    command: ['sh', '-c', 'node dist/db/seed.js && node dist/scripts/flito-seed.js']
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: flito/api:local
    environment: *api-env
    volumes:
      # Credencial de Google Drive montada en solo lectura. Va por volumen y no por COPY
      # en el Dockerfile para que la clave no quede horneada en la imagen.
      # Si no tienes el archivo, comenta esta línea: sin él el módulo de Drive falla, pero
      # el resto de la app arranca igual (el cron viene apagado por defecto).
      - ${GOOGLE_DRIVE_KEY_FILE:-./apps/api/service-account.json}:/run/secrets/google-service-account.json:ro
    ports:
      - '127.0.0.1:${API_PORT:-4052}:${API_PORT:-4052}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # La api espera al seed para que `up` no devuelva el control antes de que se pueda
      # iniciar sesión: sin esto habría carrera y el primer login fallaría por BD sin usuarios.
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:'+(process.env.PORT||4052)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: flito/web:local
    environment:
      NGINX_PORT: ${FRONTEND_PORT:-4051}
      API_HOST: api
      API_PORT: ${API_PORT:-4052}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-4051}:${FRONTEND_PORT:-4051}'
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:${FRONTEND_PORT:-4051}/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: *restart

volumes:
  pgdata:
  miniodata:
