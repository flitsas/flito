<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kit/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLIT Operaciones</title>
    <!-- PWA (Logística Fase 2): instalable en el teléfono del mensajero (CA-14). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#162744" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FLIT" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <!-- UI Kit 2026: Poppins autohospedada (mismo origen). Preload de los dos pesos del primer paint. -->
    <link rel="preload" href="/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Tema antes de la primera pintura (UI Kit 2026): guardado o el del sistema, SIEMPRE resuelto a
      // light o dark. Clave `flit-tema` (la de la suite). `aura-theme` se lee como respaldo para no perder
      // la preferencia de quien ya la tenía. Debe resolver igual que applyDocumentTheme() en src/lib/theme.tsx.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('flit-tema');
          if (t !== 'light' && t !== 'dark') t = localStorage.getItem('aura-theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body class="kit-cuerpo">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
