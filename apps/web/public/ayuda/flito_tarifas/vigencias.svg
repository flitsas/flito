<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t">
  <title id="t">Cómo cambia el valor de una tarifa y qué queda en el historial (diagrama demo, sin datos reales)</title>
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="30" y="40" width="220" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="140" y="86" font-size="18">Sin configurar</text>
    <rect x="290" y="40" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="400" y="74" font-size="18">Fijar valor</text>
    <text x="400" y="98" font-size="15">y Guardar</text>
    <rect x="550" y="40" width="220" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="660" y="74" font-size="18">Vigente</text>
    <text x="660" y="98" font-size="15">desde ese momento</text>
    <rect x="550" y="220" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="660" y="254" font-size="18">Cambiar</text>
    <text x="660" y="278" font-size="15">cierra la anterior</text>
    <rect x="290" y="220" width="220" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="400" y="254" font-size="18">Dejar de cobrar</text>
    <text x="400" y="278" font-size="15">y confirmar</text>
    <rect x="160" y="390" width="480" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="400" y="424" font-size="18">Historial: valor, desde, hasta</text>
    <text x="400" y="448" font-size="15">quién la fijó y quién la cerró</text>

  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M250 80L285 80"/>
    <path d="M510 80L545 80"/>
    <path d="M630 120L630 215"/>
    <path d="M710 220L710 125"/>
    <path d="M560 120L460 215"/>
    <path d="M290 260C150 260 120 200 130 125"/>
