<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t">
  <title id="t">Recorrido del mensajero en Mi ruta: recoger licencias en el organismo y entregarlas firmadas, con la devolución y el trabajo sin señal (diagrama demo, sin datos reales)</title>
  <rect width="1000" height="460" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <text x="20" y="34" font-size="15" text-anchor="start" font-weight="bold">En el organismo</text>
    <rect x="20" y="50" width="200" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="120" y="84" font-size="16">Escanear LT</text>
    <text x="120" y="106" font-size="13">o pegar el código</text>
    <rect x="290" y="50" width="200" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="390" y="84" font-size="16">Validación</text>
    <text x="390" y="106" font-size="13">cruce por placa y VIN</text>
    <rect x="560" y="50" width="200" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="660" y="84" font-size="16">Confirmar recogida</text>
    <text x="660" y="106" font-size="13">la LT queda Registrada</text>
    <line x1="220" y1="90" x2="288" y2="90" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="490" y1="90" x2="558" y2="90" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <text x="525" y="76" font-size="12">Relacionada</text>
    <path d="M390 130 L390 175" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#f)"/>
    <text x="400" y="196" font-size="13" text-anchor="start">Sin trámite, Novedad (VIN) o No gestionable: no se registra</text>

    <text x="20" y="250" font-size="15" text-anchor="start" font-weight="bold">En la compañía (acta despachada)</text>
    <rect x="20" y="266" width="200" height="80" rx="12" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
    <text x="120" y="300" font-size="16">Entregar</text>
    <text x="120" y="322" font-size="13">receptor y firma</text>
    <rect x="290" y="266" width="200" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="390" y="300" font-size="16">Confirmar entrega</text>
    <text x="390" y="322" font-size="13">con la ubicación</text>
    <rect x="560" y="266" width="200" height="80" rx="12" fill="#fde8e8" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="660" y="300" font-size="16">Devolver</text>
    <text x="660" y="322" font-size="13">el receptor no recibe</text>
    <line x1="220" y1="306" x2="288" y2="306" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <path d="M120 346 L120 376 L660 376 L660 348" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#f)"/>

    <rect x="800" y="150" width="180" height="110" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="890" y="184" font-size="16">Sin señal</text>
    <text x="890" y="206" font-size="13">los cambios quedan</text>
    <text x="890" y="224" font-size="13">en cola y se envían</text>
    <text x="890" y="242" font-size="13">al Reintentar</text>

    <text x="500" y="430" font-size="13" fill="#4a5568">Generar el acta y elegir el mensajero se hace en Logística, no en Mi ruta.</text>
  </g>
</svg>
