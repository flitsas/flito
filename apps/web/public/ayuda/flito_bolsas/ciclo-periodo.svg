<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t">
  <title id="t">Ciclo de la bolsa de un cliente dentro de un periodo contable (diagrama demo, sin datos reales)</title>
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="30" y="40" width="230" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="145" y="74" font-size="18">Crear bolsa</text>
    <text x="145" y="98" font-size="15">y elegir sus conceptos</text>
    <rect x="300" y="40" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="410" y="74" font-size="18">Recargas y consumos</text>
    <text x="410" y="98" font-size="15">del periodo</text>
    <rect x="560" y="40" width="210" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="665" y="74" font-size="18">Movimiento manual</text>
    <text x="665" y="98" font-size="15">o corrección</text>
    <rect x="560" y="230" width="210" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="665" y="264" font-size="18">Cerrar el periodo</text>
    <text x="665" y="288" font-size="15">Confirmar el cierre</text>
    <rect x="300" y="230" width="220" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="410" y="264" font-size="18">Periodo cerrado</text>
    <text x="410" y="288" font-size="15">irreversible</text>
    <rect x="300" y="390" width="220" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="410" y="424" font-size="18">Descargar el reporte</text>
    <text x="410" y="448" font-size="15">del periodo</text>

  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M260 80L295 80"/>
    <path d="M520 80L555 80"/>
    <path d="M665 120L665 225"/>
    <path d="M560 270L525 270"/>
    <path d="M410 310L410 385"/>
