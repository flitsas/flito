<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t">
  <title id="t">Camino de un caso detenido en la bandeja de Siigo (diagrama demo, sin datos reales)</title>
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#1a202c">
    <rect x="300" y="40" width="200" height="70" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="400" y="82">Caso detenido</text>

    <rect x="30" y="210" width="220" height="70" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="140" y="240">Reintentar la emisión</text>
    <text x="140" y="265" font-size="16">o Reenviar el correo</text>

    <rect x="290" y="210" width="220" height="70" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="400" y="252">Registrar una corrección</text>

    <rect x="550" y="210" width="220" height="70" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="660" y="252">Dar por perdido</text>



    <rect x="550" y="390" width="220" height="70" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="660" y="420" font-size="17">Dado por perdido</text>
    <text x="660" y="445" font-size="15">(Volver a intentarlo)</text>
  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M360 110L160 205"/>
    <path d="M400 110L400 205"/>
    <path d="M440 110L640 205"/>
    <path d="M660 280L660 385"/>
    <path d="M720 390C790 300 760 90 505 75"/>
  </g>
</svg>
