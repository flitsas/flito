<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t">
  <title id="t">Reparto de permisos de un rol: elegir el rol, desplegar, marcar elemento, ítem y acción, revisar lo pendiente y guardar o descartar; el guardado se rechaza si dejaría a FLITO sin administrador (diagrama demo)</title>
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="10" y="60" width="170" height="84" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="95" y="98" font-size="16">Elegir rol</text>
    <text x="95" y="120" font-size="13">en la lista</text>
    <rect x="215" y="60" width="170" height="84" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="300" y="98" font-size="16">Desplegar</text>
    <text x="300" y="120" font-size="13">elemento e ítem</text>
    <rect x="420" y="60" width="170" height="84" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="505" y="98" font-size="16">Marcar</text>
    <text x="505" y="120" font-size="13">elemento, ítem y acción</text>
    <rect x="625" y="60" width="170" height="84" rx="12" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
    <text x="710" y="98" font-size="16">Sin guardar</text>
    <text x="710" y="120" font-size="13">N cambios</text>
    <rect x="830" y="60" width="160" height="84" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="910" y="98" font-size="16">Guardado</text>
    <text x="910" y="120" font-size="13">siguiente acción</text>
    <line x1="180" y1="102" x2="213" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="385" y1="102" x2="418" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="590" y1="102" x2="623" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="795" y1="102" x2="828" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <text x="812" y="40" font-size="13">Guardar</text>
    <text x="812" y="55" font-size="12">cambios</text>
    <rect x="560" y="290" width="190" height="84" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="655" y="328" font-size="16">Descartar</text>
    <text x="655" y="350" font-size="13">vuelve a lo guardado</text>
    <rect x="780" y="290" width="210" height="84" rx="12" fill="#fde8e8" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="885" y="328" font-size="16">No se guardó</text>
    <text x="885" y="350" font-size="13">dejaría a FLITO sin admin</text>
    <path d="M690 144 L690 230 L655 230 L655 288" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <path d="M900 144 L900 288" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#f)"/>
    <text x="910" y="220" font-size="13" text-anchor="start">Por seguridad</text>
    <rect x="10" y="290" width="250" height="84" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="135" y="328" font-size="16">Nuevo rol / Editar rol</text>
    <text x="135" y="350" font-size="13">nombre, descripción, Enlace</text>
    <path d="M95 144 L95 288" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <text x="500" y="420" font-size="13" fill="#4a5568">Un permiso vale solo si están marcados el elemento, el ítem y la acción. Los usuarios del rol lo ven en su siguiente acción.</text>
  </g>
</svg>
