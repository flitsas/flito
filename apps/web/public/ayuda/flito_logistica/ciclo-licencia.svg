<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t">
  <title id="t">Ciclo de una licencia de tránsito en Logística: de Pendiente de recogida a Entregada, con la novedad y la devolución como desvíos (diagrama demo, sin datos reales)</title>
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="10" y="60" width="170" height="84" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="95" y="95" font-size="16">Pendiente</text>
    <text x="95" y="117" font-size="16">de recogida</text>
    <rect x="215" y="60" width="160" height="84" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="295" y="95" font-size="16">Registrada</text>
    <text x="295" y="117" font-size="13">escaneada en el organismo</text>
    <rect x="410" y="60" width="160" height="84" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="490" y="95" font-size="16">En acta</text>
    <text x="490" y="117" font-size="13">una por empresa</text>
    <rect x="605" y="60" width="170" height="84" rx="12" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
    <text x="690" y="95" font-size="16">Despachada</text>
    <text x="690" y="117" font-size="13">con el mensajero</text>
    <rect x="810" y="60" width="180" height="84" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="900" y="95" font-size="16">Entregada</text>
    <text x="900" y="117" font-size="13">firma del receptor</text>

    <line x1="180" y1="102" x2="213" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="375" y1="102" x2="408" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="570" y1="102" x2="603" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="775" y1="102" x2="808" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>

    <text x="197" y="40" font-size="13">Mensajero</text>
    <text x="197" y="55" font-size="12">escanea (Mi ruta)</text>
    <text x="392" y="40" font-size="13">Generar</text>
    <text x="392" y="55" font-size="12">acta</text>
    <text x="587" y="40" font-size="13">Firmar y</text>
    <text x="587" y="55" font-size="12">despachar</text>
    <text x="792" y="40" font-size="13">Confirmar</text>
    <text x="792" y="55" font-size="12">entrega (Mi ruta)</text>

    <rect x="390" y="290" width="220" height="84" rx="12" fill="#fde8e8" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="500" y="325" font-size="16">Con novedad</text>
    <text x="500" y="347" font-size="13">con su motivo en la bitácora</text>

    <path d="M295 144 L295 230 L440 230 L440 288" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#f)"/>
    <text x="320" y="220" font-size="13" text-anchor="start">Novedad (daño o inconsistencia)</text>
    <path d="M690 144 L690 230 L560 230 L560 288" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#f)"/>
    <text x="680" y="262" font-size="13" text-anchor="end">Devolver (no recibió)</text>

    <text x="500" y="420" font-size="13" fill="#4a5568">El Administrador opera en Logística; el Mensajero recoge y entrega desde Mi ruta.</text>
  </g>
</svg>
