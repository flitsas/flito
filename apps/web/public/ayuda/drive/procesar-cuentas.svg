<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t">
  <title id="t">Procesamiento de cuentas de cobro en Google Drive: abrir la carpeta, elegir el PDF, procesar, revisar el resultado y descargar el Excel resumen o cada cuenta (diagrama demo, sin datos reales)</title>
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="10" y="60" width="170" height="84" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="95" y="98" font-size="16">Carpeta raíz</text>
    <text x="95" y="120" font-size="13">carpetas compartidas</text>
    <rect x="215" y="60" width="170" height="84" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="300" y="98" font-size="16">Abrir carpeta</text>
    <text x="300" y="120" font-size="13">Atrás para volver</text>
    <rect x="420" y="60" width="170" height="84" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="505" y="98" font-size="16">PDF de cuentas</text>
    <text x="505" y="120" font-size="13">de cobro</text>
    <rect x="625" y="60" width="170" height="84" rx="12" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
    <text x="710" y="98" font-size="16">Procesando…</text>
    <text x="710" y="120" font-size="13">lee cada página</text>
    <rect x="830" y="60" width="160" height="84" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="910" y="98" font-size="16">Resultado</text>
    <text x="910" y="120" font-size="13">cuentas y valor</text>
    <line x1="180" y1="102" x2="213" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="385" y1="102" x2="418" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="590" y1="102" x2="623" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="795" y1="102" x2="828" y2="102" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <text x="607" y="40" font-size="13">Procesar</text>
    <text x="607" y="55" font-size="12">un PDF a la vez</text>
    <rect x="640" y="290" width="160" height="84" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="720" y="328" font-size="16">Excel</text>
    <text x="720" y="350" font-size="13">resumen</text>
    <rect x="820" y="290" width="170" height="84" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="905" y="328" font-size="16">PDF</text>
    <text x="905" y="350" font-size="13">por cuenta</text>
    <path d="M880 144 L880 230 L720 230 L720 288" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <line x1="905" y1="144" x2="905" y2="288" stroke="#4a5568" stroke-width="2" marker-end="url(#f)"/>
    <text x="700" y="262" font-size="13" text-anchor="end">Descargar Excel resumen</text>
    <text x="915" y="262" font-size="13" text-anchor="start">Descargar</text>
    <rect x="330" y="290" width="220" height="84" rx="12" fill="#fde8e8" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="440" y="328" font-size="16">Carpeta vacía</text>
    <text x="440" y="350" font-size="13">o sin acceso</text>
    <path d="M300 144 L300 230 L440 230 L440 288" fill="none" stroke="#c53030" stroke-width="2" marker-end="url(#f)"/>
    <text x="310" y="220" font-size="13" text-anchor="start">No compartida con FLITO</text>
    <text x="500" y="420" font-size="13" fill="#4a5568">Ver y descargar no cambian nada en Drive; Procesar solo lee el PDF.</text>
  </g>
</svg>
