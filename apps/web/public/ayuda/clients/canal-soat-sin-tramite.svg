<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-labelledby="t">
  <title id="t">Abrir el canal SOAT sin trámite de una compañía y a dónde salen sus solicitudes (diagrama demo, sin datos reales)</title>
  <rect width="820" height="480" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="30" y="40" width="220" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="140" y="74" font-size="17">Cerrado</text>
    <text x="140" y="96" font-size="14">así nace cada compañía</text>
    <rect x="300" y="40" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="410" y="74" font-size="17">Canal abierto</text>
    <text x="410" y="96" font-size="14">marcado en el cuadro</text>
    <rect x="570" y="40" width="220" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="680" y="74" font-size="17">¿Gestor por defecto?</text>
    <text x="680" y="96" font-size="14">elegido en la lista</text>
    <rect x="570" y="200" width="220" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="680" y="234" font-size="17">No se guarda</text>
    <text x="680" y="256" font-size="14">el cuadro pide el gestor</text>
    <rect x="300" y="200" width="220" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="410" y="234" font-size="17">Abierto · gestor</text>
    <text x="410" y="256" font-size="14">solicitudes nuevas al gestor</text>
    <rect x="300" y="360" width="220" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="410" y="394" font-size="17">Gestor inactivo</text>
    <text x="410" y="416" font-size="14">o «Abierto · sin gestor»</text>
    <rect x="570" y="360" width="220" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="680" y="394" font-size="17">Gestionado por</text>
    <text x="680" y="416" font-size="14">Operaciones</text>
    <text x="696" y="165" font-size="13" fill="#4a5568">no</text>
    <text x="548" y="150" font-size="13" fill="#4a5568">sí · Guardar</text>
  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M250 80L295 80"/>
    <path d="M520 80L565 80"/>
    <path d="M680 120L680 195"/>
    <path d="M620 120L525 205"/>
    <path d="M410 280L410 355"/>
    <path d="M520 400L565 400"/>
  </g>
</svg>
