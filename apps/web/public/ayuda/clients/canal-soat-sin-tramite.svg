<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-labelledby="t">
  <title id="t">Elegir el proveedor de SOAT sin trámite de una compañía y a dónde salen sus solicitudes (diagrama demo, sin datos reales)</title>
  <rect width="820" height="360" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="300" y="30" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="410" y="64" font-size="17">Proveedor de SOAT</text>
    <text x="410" y="86" font-size="14">elegido en el cuadro</text>
    <rect x="30" y="180" width="220" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="140" y="214" font-size="17">Sin proveedor</text>
    <text x="140" y="236" font-size="14">nadie puede solicitar</text>
    <rect x="300" y="180" width="220" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="410" y="214" font-size="17">Proveedor activo</text>
    <text x="410" y="236" font-size="14">solicitudes nuevas a él</text>
    <rect x="570" y="180" width="220" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="680" y="214" font-size="17">Proveedor (inactivo)</text>
    <text x="680" y="236" font-size="14">Gestionado por Operaciones</text>
    <text x="215" y="140" font-size="13" fill="#4a5568">«Sin proveedor»</text>
    <text x="440" y="150" font-size="13" fill="#4a5568">activo</text>
    <text x="620" y="140" font-size="13" fill="#4a5568">inactivo</text>
  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M330 110L190 175"/>
    <path d="M410 110L410 175"/>
    <path d="M490 110L630 175"/>
  </g>
</svg>
