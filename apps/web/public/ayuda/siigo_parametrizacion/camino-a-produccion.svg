<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t">
  <title id="t">Camino de la parametrización hasta habilitar la emisión en producción (diagrama demo, sin datos reales)</title>
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="30" y="40" width="220" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="140" y="74" font-size="18">1. Mapear conceptos</text>
    <text x="140" y="98" font-size="15">Editar o Crear producto</text>
    <rect x="290" y="40" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="400" y="74" font-size="18">2. Corregir fichas</text>
    <text x="400" y="98" font-size="15">de los clientes pendientes</text>
    <rect x="550" y="40" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="660" y="74" font-size="18">3. Confirmar</text>
    <text x="660" y="98" font-size="15">equivalencias de ciudad</text>
    <rect x="550" y="210" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="660" y="244" font-size="18">4. Sincronizar</text>
    <text x="660" y="268" font-size="15">terceros con Siigo</text>
    <polygon points="400,190.0 525.0,250 400,310.0 275.0,250" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
    <text x="400" y="245" font-size="16">¿La compuerta</text>
    <text x="400" y="267" font-size="16">tiene motivos?</text>
    <rect x="30" y="390" width="260" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="160" y="424" font-size="18">Emisión en producción</text>
    <text x="160" y="448" font-size="15">bloqueada: corregir el motivo</text>
    <rect x="510" y="390" width="260" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="640" y="424" font-size="18">Emisión en producción</text>
    <text x="640" y="448" font-size="15">habilitada</text>
    <text x="205" y="330" font-size="15" fill="#4a5568">Sí</text>
    <text x="575" y="330" font-size="15" fill="#4a5568">No</text>
  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M250 80L285 80"/>
    <path d="M510 80L545 80"/>
    <path d="M660 120L660 205"/>
    <path d="M550 250L530 250"/>
    <path d="M300 270L160 385"/>
    <path d="M480 290L620 385"/>
    <path d="M140 390C40 320 40 200 135 125"/>
  </g>
</svg>
