<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t">
  <title id="t">Ciclo de una boleta del portal SOAT en Conciliación (diagrama demo, sin datos reales)</title>
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="30" y="40" width="220" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="140" y="74" font-size="18">Cargar boleta</text>
    <text x="140" y="98" font-size="15">no mueve dinero</text>
    <rect x="290" y="40" width="200" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="390" y="74" font-size="18">FLITO cruza</text>
    <text x="390" y="98" font-size="15">cada línea</text>
    <polygon points="640,15.0 770.0,80 640,145.0 510.0,80" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
    <text x="640" y="75" font-size="16">¿Todas las</text>
    <text x="640" y="97" font-size="16">líneas cuadran?</text>
    <rect x="290" y="210" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="400" y="244" font-size="18">Corregir y</text>
    <text x="400" y="268" font-size="15">Volver a cruzar</text>
    <rect x="30" y="210" width="220" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="140" y="244" font-size="18">Descartar</text>
    <text x="140" y="268" font-size="15">se pierde el cruce</text>
    <rect x="550" y="210" width="220" height="100" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="660" y="242" font-size="18">Conciliar boleta</text>
    <text x="660" y="266" font-size="15">descuenta de las bolsas;</text>
    <text x="660" y="290" font-size="15">no se puede deshacer</text>
    <rect x="550" y="390" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="660" y="424" font-size="18">Adjuntar el</text>
    <text x="660" y="448" font-size="15">Comprobante del pago PSE</text>
    <text x="540" y="175" font-size="15" fill="#4a5568">No</text>
    <text x="690" y="185" font-size="15" fill="#4a5568">Sí</text>
  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M250 80L285 80"/>
    <path d="M490 80L505 80"/>
    <path d="M560 120L470 205"/>
    <path d="M400 210L400 125"/>
    <path d="M290 250L255 250"/>
    <path d="M660 145L660 205"/>
    <path d="M660 310L660 385"/>
  </g>
</svg>
