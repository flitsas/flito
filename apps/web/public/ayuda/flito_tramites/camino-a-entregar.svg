<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="t">
  <title id="t">Camino de un trámite en Gestión Trámites: de recién llegado a Entregado (diagrama demo, sin datos reales)</title>
  <rect width="820" height="520" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="30" y="40" width="220" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="140" y="74" font-size="17">Llega de FLIT o FLIT 2</text>
    <text x="140" y="96" font-size="14">sin que usted haga nada</text>
    <rect x="300" y="40" width="220" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="410" y="74" font-size="17">¿Asignado?</text>
    <text x="410" y="96" font-size="14">empresa y secretaría</text>
    <rect x="570" y="40" width="220" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="680" y="74" font-size="17">Crear empresa</text>
    <text x="680" y="96" font-size="14">o emparejar la secretaría</text>
    <rect x="300" y="200" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="410" y="234" font-size="17">Solicitar SOAT</text>
    <text x="410" y="256" font-size="14">e impuestos (o ambos)</text>
    <rect x="300" y="360" width="220" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="410" y="394" font-size="17">Listo para entregar</text>
    <text x="410" y="416" font-size="14">SOAT e impuestos resueltos</text>
    <rect x="570" y="360" width="220" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="680" y="394" font-size="17">Entregado</text>
    <text x="680" y="416" font-size="14">al marcar y pulsar Entregar</text>
    <text x="543" y="70" font-size="13" fill="#4a5568">no</text>
    <text x="426" y="160" font-size="13" fill="#4a5568">sí</text>
    <text x="470" y="320" font-size="13" fill="#4a5568">el gestor y el organismo responden</text>
  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M250 80L295 80"/>
    <path d="M520 80L565 80"/>
    <path d="M680 120Q680 160 525 110"/>
    <path d="M410 120L410 195"/>
    <path d="M410 280L410 355"/>
    <path d="M520 400L565 400"/>
  </g>
</svg>
