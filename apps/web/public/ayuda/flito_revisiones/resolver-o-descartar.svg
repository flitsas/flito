<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t">
  <title id="t">Qué pasa con un documento en Revisiones OCR: resolver contra un trámite o descartarlo (diagrama demo, sin datos reales)</title>
  <rect width="820" height="440" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="30" y="40" width="220" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="140" y="74" font-size="17">Documento en la cola</text>
    <text x="140" y="96" font-size="14">la lectura no cuadró</text>
    <rect x="300" y="40" width="220" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="410" y="74" font-size="17">Elegir el trámite</text>
    <text x="410" y="96" font-size="14">y revisar cada campo</text>
    <rect x="570" y="40" width="220" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="680" y="74" font-size="17">¿Corresponde?</text>
    <text x="680" y="96" font-size="14">al trámite elegido</text>
    <rect x="440" y="260" width="220" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="550" y="294" font-size="17">Confirmar y resolver</text>
    <text x="550" y="316" font-size="14">constancia + Resolver</text>
    <rect x="160" y="260" width="240" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="280" y="294" font-size="17">Descartar documento</text>
    <text x="280" y="316" font-size="14">motivo + Descartar</text>
    <text x="640" y="190" font-size="13" fill="#4a5568">sí</text>
    <text x="390" y="170" font-size="13" fill="#4a5568">no</text>
  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M250 80L295 80"/>
    <path d="M520 80L565 80"/>
    <path d="M650 120L560 255"/>
    <path d="M600 120Q300 170 290 255"/>
  </g>
</svg>
