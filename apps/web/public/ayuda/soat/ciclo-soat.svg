<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="t">
  <title id="t">Ciclo de un SOAT en la cola: de Pendiente a Pagado, con la novedad y la solicitud por validar (diagrama demo, sin datos reales)</title>
  <rect width="820" height="520" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1a202c">
    <rect x="30" y="40" width="200" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="130" y="74" font-size="17">Pendiente</text>
    <text x="130" y="96" font-size="14">llegó de Gestión Trámites</text>
    <rect x="310" y="40" width="200" height="80" rx="12" fill="#e0ecff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="410" y="74" font-size="17">Solicitado</text>
    <text x="410" y="96" font-size="14">en manos del gestor</text>
    <rect x="590" y="40" width="200" height="80" rx="12" fill="#e6f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="690" y="74" font-size="17">Pagado</text>
    <text x="690" y="96" font-size="14">póliza en Ver soporte</text>
    <rect x="310" y="220" width="200" height="80" rx="12" fill="#fde2e2" stroke="#c53030" stroke-width="2"/>
    <text x="410" y="254" font-size="17">Con novedad</text>
    <text x="410" y="276" font-size="14">lo resuelve FLITO</text>
    <rect x="30" y="380" width="200" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="130" y="414" font-size="17">Solicitar SOAT</text>
    <text x="130" y="436" font-size="14">Cliente · consulta al RUNT</text>
    <rect x="310" y="380" width="200" height="80" rx="12" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="410" y="414" font-size="17">Por validar</text>
    <text x="410" y="436" font-size="14">el RUNT no respondió</text>
    <rect x="590" y="380" width="200" height="80" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
    <text x="690" y="414" font-size="17">Descartadas</text>
    <text x="690" y="436" font-size="14">quedan como constancia</text>
    <text x="270" y="30" font-size="13" fill="#4a5568">Enviar al gestor</text>
    <text x="550" y="30" font-size="13" fill="#4a5568">Cargar factura</text>
    <text x="352" y="170" font-size="13" fill="#4a5568">Rechazar</text>
    <text x="474" y="170" font-size="13" fill="#4a5568">Reactivar</text>
    <text x="110" y="300" font-size="13" fill="#4a5568">RUNT responde</text>
    <text x="270" y="370" font-size="13" fill="#4a5568">sin respuesta</text>
    <text x="550" y="370" font-size="13" fill="#4a5568">RUNT impide</text>
    <text x="508" y="340" font-size="13" fill="#4a5568">Reintentar consulta</text>
  </g>
  <g stroke="#4a5568" stroke-width="2.5" fill="none" marker-end="url(#f)">
    <path d="M230 80L305 80"/>
    <path d="M510 80L585 80"/>
    <path d="M390 120L390 215"/>
    <path d="M430 220L430 125"/>
    <path d="M130 380L130 220Q130 160 305 100"/>
    <path d="M230 420L305 420"/>
    <path d="M510 420L585 420"/>
    <path d="M450 380L450 300Q450 200 480 125"/>
  </g>
</svg>
